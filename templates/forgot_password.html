<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - JamboLetu</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1E3A8A, #2D0A31); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { max-width: 420px; width: 100%; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
<div class="card auth-card p-4 bg-white">
    <div class="text-center mb-3">
        <h4 class="fw-bold text-primary">Recover Password</h4>
        <p class="text-muted small">Enter your registered email to receive a password reset link</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('forgot_password') }}">
        <div class="mb-3">
            <label class="form-label fw-semibold">Registered Email</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Send Reset Link</button>
    </form>

    <hr>
    <p class="text-center small mb-0"><a href="{{ url_for('login') }}" class="text-decoration-none">← Back to Login</a></p>
</div>
</body>
</html>
