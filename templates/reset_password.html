<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - JamboLetu</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1E3A8A, #2D0A31); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { max-width: 420px; width: 100%; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
<div class="card auth-card p-4 bg-white">
    <div class="text-center mb-3">
        <h4 class="fw-bold text-primary">Create New Password</h4>
        <p class="text-muted small">Must include 8+ chars, uppercase, lowercase, number, and symbol</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">New Strong Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter new password" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Confirm New Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
        </div>
        <button type="submit" class="btn btn-success w-100 fw-bold py-2">Update Password</button>
    </form>
</div>
</body>
</html>
