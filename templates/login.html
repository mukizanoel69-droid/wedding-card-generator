<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - JamboLetu Card Studio</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1E3A8A, #2D0A31); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { max-width: 420px; width: 100%; border-radius: 16px; box-shadow: 0 12px 30px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
<div class="card auth-card p-4 bg-white">
    <div class="text-center mb-3">
        <h3 class="fw-bold text-primary">JamboLetu Studio</h3>
        <p class="text-muted small">Sign in to manage your events and cards</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2 small">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username or Email</label>
            <input type="text" name="username" class="form-control" placeholder="Enter username or email" required>
        </div>
        <div class="mb-2">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>
        <div class="text-end mb-3">
            <a href="{{ url_for('forgot_password') }}" class="small text-decoration-none">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Login</button>
    </form>

    <hr>
    <p class="text-center small mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none">Create Account</a></p>
</div>
</body>
</html>
